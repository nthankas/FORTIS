# Shared depthai_ros_driver_v3 capture config for the FORTIS chassis OAK-D Lites.
#
# ONE config for all four identical units. The primary bring-up
# (oak_chassis_cameras.launch.py) starts every connected OAK with these values;
# the single-camera front debug launch (oak_chassis_front.launch.py) uses the
# same config. Both read it through fortis_bringup.camera_params.load_camera_params(),
# which returns a NODE-AGNOSTIC param dict -- so this file is never tied to one
# camera. The top-level key below is a POSITIONAL placeholder (the loader reads
# the single ros__parameters block by position; the key name is ignored), which
# is why it is "/**" and not a node name.
#
# Driver: depthai-ros v3 (ros-humble-depthai-ros-v3, ROS 2 *testing* apt repo).
# v3 dialect: i_nn_type under pipeline_gen; device serial is driver.i_device_id
# (pinned per camera by the multi-cam launch's roster); depth align is
# stereo.i_aligned; resolution is i_width/i_height; depth tuning via
# stereo.i_depth_preset.
#
# Mode: two INDEPENDENT streams -- on-device MJPEG-encoded RGB + regular (aligned
# 16UC1) depth. No RGBD cloud (i_enable_rgbd false); fusion is a later task.
# IMU on. Scope: chassis OAK-D Lites; no VIO, no localization.
#
# Capture/timing is frozen-as-tested -- only the cloud and the RGB transport
# changed. The fps/resolution/sync below must not drift or the depth<->color
# timing mismatches come back.
#
# SYNC is automatic at matched fps: depthai drift-corrects + uses sequence
# numbers to align color/left/right capture stamps when they share one fps (on by
# default, sub-ms). The OAK-D Lite CANNOT hardware frame-sync color<->mono (the
# Lite doesn't wire color/stereo FSIN; OV7251 FSYNC unimplemented in FW), so
# i_fsync_* is a no-op -- matched i_fps below IS the per-camera sync. Across the
# 4 cameras we rely on the shared ROS clock (approx), not hardware sync.
/**:
  ros__parameters:
    # No driver.i_device_id here: the single-camera launch grabs the only OAK on
    # the bus; the multi-cam launch pins each node by serial. TF base/parent come
    # from the launch files.
    pipeline_gen:
      i_pipeline_type: rgbd     # "RGBD" = publish RGB + Depth streams (NOT the cloud)
      i_enable_rgbd: false      # no fused/registered cloud -- streams stay independent
      i_nn_type: none
      i_enable_imu: true

    stereo:
      i_aligned: true             # depth registered to the color frame (still its own topic)
      i_run_align_on_host: false  # align on the VPU, not the Jetson
      i_subpixel: false           # off keeps depth fps up; also required with low_bandwidth
      i_depth_preset: DEFAULT

    # All three sensors at 640x400 @ matched 15 fps -> matched fps is the sync
    # (see header). Verify a value took: `ros2 param get <node> rgb.i_width`.
    # RGB is MJPEG-encoded ON THE DEVICE and published as sensor_msgs/CompressedImage
    # (i_publish_compressed), so the Jetson never decodes it and Foxglove shows it
    # natively. profile 4 (MJPEG) is the default, so it's not repeated here.
    rgb:
      i_width: 640
      i_height: 400
      i_fps: 15.0
      i_low_bandwidth: true        # on-device VideoEncoder (MJPEG) -> low latency, low USB
      i_low_bandwidth_quality: 50  # MJPEG quality % -- the variable-quality knob
      i_publish_compressed: true   # publish CompressedImage(jpeg), don't decode on host
    left:
      i_width: 640
      i_height: 400
      i_fps: 15.0
    right:
      i_width: 640
      i_height: 400
      i_fps: 15.0

    # image_transport plugins for the DEPTH topic. The driver auto-advertises
    # compressedDepth + theora on every image topic; depth is 16UC1, so the JPEG
    # `compressed` plugin errors on it ("not a color format"). Keep raw +
    # compressedDepth (the depth-specific codec), drop JPEG compressed + theora.
    # (RGB needs no entry here: i_publish_compressed already makes it a single
    # CompressedImage(jpeg) topic, not a raw image with transport plugins.)
    #
    # NOTE: this block is NOT a node name. load_camera_params() strips the
    # "image_transport" key and folds its contents (stereo.image_raw.*) up into
    # the node params, so the plugin list applies under whatever camera node name
    # the launch assigns -- front, rear, left, or right.
    image_transport:
      stereo:
        image_raw:
          enable_pub_plugins:
            - image_transport/raw
            - image_transport/compressedDepth
