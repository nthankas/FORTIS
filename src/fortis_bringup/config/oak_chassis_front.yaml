# depthai_ros_driver_v3 parameters for the FORTIS front chassis camera.
#
# Driver: depthai-ros v3 (ros-humble-depthai-ros-v3, from the ROS 2 *testing*
# apt repo). v3 reorganized params vs v2: i_nn_type moved into pipeline_gen,
# the device serial is driver.i_device_id (was camera.i_mx_id), depth align is
# stereo.i_aligned (was stereo.i_align_depth), resolution is i_width/i_height
# (was i_resolution), and depth tuning is via stereo.i_depth_preset.
#
# The top-level key MUST equal the node name set in oak_chassis_front.launch.py
# (name:=oak_chassis_front) or the driver runs on defaults. ROS silently
# ignores unknown params, so keep names in the v3 dialect -- a v2 name here
# would be dropped with NO error.
#
# Scope: the FRONT OAK-D Lite only. No VIO, no localization.
/oak_chassis_front:
  ros__parameters:
    # NOTE: no driver.i_device_id here. With a single camera the driver grabs
    # the only OAK on the bus ("connecting to the next available device"). For
    # the future 4-camera chassis, pin each node by serial again
    # (driver.i_device_id, from depthai getAllAvailableDevices()); now that the
    # container binds the full /dev tree, the post-boot re-find works with the
    # id set. TF prefix/parent params are injected by the launch file.
    pipeline_gen:
      i_pipeline_type: rgbd     # RGB + stereo depth, synced for RGBD
      i_enable_rgbd: true       # publish the colored RGBD point cloud
      i_nn_type: none           # no on-device NN yet (Graphite not trained)
      i_enable_imu: true        # publish IMU if the unit has one

    stereo:
      i_aligned: true           # align depth to RGB -> colored, registered cloud
      # Subpixel sharpens far depth but adds RVC2 load. With it ON at 1080p
      # RGBD the OAK-D Lite couldn't hold frame rate, so color and depth drifted
      # apart and the Sync node spammed "messages still not in sync". OFF =
      # lighter pipeline, steady sync. Flip to true if you need finer far-range
      # depth and can accept lower fps.
      i_subpixel: false
      i_depth_preset: DEFAULT   # v3 depth-quality preset

    # RGB + mono resolution and frame rate. v3 uses i_width/i_height (not v2's
    # i_resolution). 1080p color + 480p mono keeps the cloud light -- point
    # count is bounded by the 640x480 depth, not the color res -- while RGB
    # stays crisp.
    #
    # i_fps MUST match across rgb/left/right. The RGBD Sync node pairs a color
    # frame to a depth frame by timestamp; mismatched rates never line up and it
    # never syncs. 15 fps (matched) also roughly halves device + network load vs
    # 30 -- smoother over the Foxglove link. Verify each took:
    # `ros2 param get /oak_chassis_front rgb.i_fps` (driver silently drops
    # unknown/mistyped param names).
    rgb:
      i_width: 1920
      i_height: 1080
      i_fps: 15.0
    left:
      i_width: 640
      i_height: 480
      i_fps: 15.0
    right:
      i_width: 640
      i_height: 480
      i_fps: 15.0
