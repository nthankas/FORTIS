# depthai_ros_driver_v3 parameters for the FORTIS front chassis camera.
#
# Driver: depthai-ros v3 (ros-humble-depthai-ros-v3, ROS 2 *testing* apt repo).
# v3 dialect: i_nn_type under pipeline_gen; device serial is driver.i_device_id;
# depth align is stereo.i_aligned; resolution is i_width/i_height; depth tuning
# via stereo.i_depth_preset. The top-level key MUST equal the launch node name
# (oak_chassis_front) or the driver runs on defaults; unknown names are silently
# dropped (so verify with `ros2 param get`).
#
# Scope: the FRONT OAK-D Lite only. No VIO, no localization.
#
# --- Two facts from the Luxonis v3 docs that drive this config ---
#
# 1. RESOLUTION sets the cloud cost. The RGBD node aligns depth to the COLOR
#    image and emits one point per COLOR pixel. At 1080p that is ~2M points/
#    frame; the OAK-D Lite RVC2 only assembled it at ~0.2-0.5 Hz (measured) and
#    the backpressure throttled RGB too. The official v3 RGBD example runs color
#    AND stereo at 640x400 (~256k points) at 30 Hz. We match 640x400 so the
#    cloud is usable -- and a smaller cloud also lightens the USB + Jetson +
#    network load. (docs.luxonis.com/software-v3 -> examples/rgbd/rgbd)
#
# 2. SYNC is automatic at matched fps. depthai firmware drift-corrects + uses
#    sequence numbers to align left/right/color capture stamps when they share
#    one fps (on by default, sub-ms). The OAK-D Lite CANNOT hardware frame-sync
#    color<->mono (Luxonis frame-sync docs: the Lite does not wire color/stereo
#    FSIN together; OV7251 FSYNC is unimplemented in FW). So i_fsync_* is a
#    no-op here -- matched i_fps below IS the sync.
/oak_chassis_front:
  ros__parameters:
    # No driver.i_device_id: single camera grabs the only OAK on the bus. For
    # the future 4-camera chassis, pin each node by serial. TF prefix/parent
    # come from the launch file.
    pipeline_gen:
      i_pipeline_type: rgbd
      i_enable_rgbd: true
      i_nn_type: none
      i_enable_imu: true

    # Build the RGBD cloud + depth->color align ON THE DEVICE (RVC2), matching
    # the Luxonis example. This offloads the Jetson CPU. The earlier "device is
    # slow" result was the 1080p point count, NOT where the work ran -- at
    # 640x400 the device path is what Luxonis ships at 30 Hz.
    rgbd:
      i_run_sync_on_host: false
      i_run_align_on_host: false

    stereo:
      i_aligned: true             # align depth to color -> colored registered cloud
      i_run_align_on_host: false  # align on the VPU, not the Jetson
      i_subpixel: false           # off keeps depth fps up on the RVC2
      i_depth_preset: DEFAULT

    # All three sensors at 640x400 @ matched 15 fps. Matched fps triggers the
    # automatic firmware/sequence-number sync. 640x400 keeps the cloud ~256k
    # points. Verify a value took: `ros2 param get /oak_chassis_front rgb.i_width`.
    rgb:
      i_width: 640
      i_height: 400
      i_fps: 15.0
    left:
      i_width: 640
      i_height: 400
      i_fps: 15.0
    right:
      i_width: 640
      i_height: 400
      i_fps: 15.0
