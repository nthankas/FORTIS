# FORTIS bringup parameter defaults.
#
# Loaded by fortis_bringup/launch/bringup.launch.py and applied per node
# via the Node(parameters=[...]) argument. Each top-level key is a
# fully-qualified node name; values under "ros__parameters:" are the
# defaults that node will see at startup unless a launch arg overrides.
#
# Some fortis_* nodes do NOT call declare_parameter() (see
# src/fortis_drive/README.md "Parameters" section for the rationale:
# the module-level constants were left in code to make accidental
# override impossible). For those, loading this YAML is a no-op in ROS 2
# Humble: the parameter is registered but no code reads it, so their
# entries here are forward-looking documentation of the values that would
# become overridable once those nodes adopt declare_parameter().
#
# LIVE overrides (the node declares the parameter, so editing it here
# changes behaviour at launch): heading_hold_node, orbit_node,
# imu_gyro_debias_node, drive_node (cmd_vel_timeout_s), teensy_bridge,
# arm_motion, and arm_controller's gripper positions. Each block notes
# whether it is live or documentation-only.
#
# What CANNOT be set here:
#   - ROS_DOMAIN_ID. This is an environment variable, not a ROS
#     parameter. The dev container exports ROS_DOMAIN_ID=42 from
#     docker/docker-compose.yml; each test package's conftest.py pins
#     its own fixed per-package ID (91-97 registry) during test runs.
#     Set it before launching, not from this file.
#   - QoS profiles. QoS is configured per-publisher/per-subscriber in
#     code, not via parameters. The /fortis/mission_state contract
#     (TRANSIENT_LOCAL + RELIABLE, depth 1) is locked across
#     mission_state_node, drive_node, and arm_controller; the
#     parameter value below is documentation only and does not
#     reconfigure the publishers/subscribers.

mission_state_node:
  ros__parameters:
    # QoS values are documentation only. Actual QoS is set in
    # fortis_safety/mission_state_node.py and must stay in lockstep
    # with the subscribers in fortis_drive and fortis_arm.
    mission_state_qos_durability: "TRANSIENT_LOCAL"
    mission_state_qos_reliability: "RELIABLE"
    mission_state_qos_depth: 1

drive_node:
  ros__parameters:
    # Reject-warning throttle interval, seconds. Drive node logs at
    # most one rejection warning per state name per this interval.
    # Hardcoded as REJECT_LOG_THROTTLE_S in drive_node.py.
    reject_log_throttle_s: 1.0
    # cmd_vel dead-man watchdog timeout, seconds: if no /cmd_vel arrives
    # within the timeout, the drive commands zeros instead of freezing at
    # the last value. LIVE: drive_node declares cmd_vel_timeout_s, so this
    # value overrides the in-code CMD_VEL_TIMEOUT_S default at launch.
    cmd_vel_timeout_s: 0.5

heading_hold_node:
  ros__parameters:
    # Heading-hold PID. UNLIKE the rest of this file, heading_hold_node DOES
    # call declare_parameter() for each of these, so these values are LIVE
    # overrides, not documentation -- editing them here actually retunes the
    # controller at launch. The node only runs when bringup is started with
    # heading_hold:=true (default false).
    #
    # PID gains on the wrapped heading error (rad). Start P-only (ki 0); add
    # ki/kd on-ground if the hold sags or oscillates. Defaults mirror the
    # DEFAULT_* constants in heading_hold_node.py.
    kp: 2.0
    ki: 0.0
    kd: 0.1
    # Output angular-velocity clamp (rad/s) and the integral-term anti-windup
    # clamp (rad/s).
    max_omega: 1.5
    i_clamp: 0.5
    # |omega_cmd| above this (rad/s) means the operator is actively turning:
    # pass their omega through and re-arm the hold target to the current yaw.
    turn_deadband: 0.05
    # Gyro-direction correction: +1.0 assumes EKF yaw increases CCW (REP-103).
    # BENCH-VERIFY before trusting on hardware: rotate the robot CCW by hand
    # and confirm /odometry/filtered yaw INCREASES; set to -1.0 only if it
    # decreases. A wrong sign makes heading-hold push the WRONG way (positive
    # feedback to the max_omega clamp).
    yaw_sign: 1.0

orbit_node:
  ros__parameters:
    # orbit_node DOES declare_parameter() for each of these, so this block is a
    # LIVE override (like heading_hold_node), not documentation. orbit_node runs
    # only when bringup is started with orbit:=true (the chassis_orbit launch).
    #
    # Tangential orbit speed (m/s at the contact patch). 0.1 is deliberately
    # slow: open-loop omni motion drifts, so the first bring-up crawls.
    orbit_speed: 0.1
    # Orbit radius (m). Arbitrary for now; smaller R => faster yaw (omega = v/R).
    orbit_radius: 1.0
    # Yaw-direction boundary correction. Bench-verified 2026-06-11: -1.0 makes
    # the FRONT (cameras) face the orbit center; +1.0 orbited facing OUTWARD
    # (back toward the center post). Flip only if the mounting/convention changes.
    omega_sign: -1.0
    # Held-command dead-man (s): no orbit_dir within this window => button
    # released => stop. Shorter than drive_node's 0.5 s watchdog for a crisp
    # release-to-stop.
    cmd_timeout_s: 0.3
    # /cmd_vel publish rate (Hz) while orbiting.
    publish_rate_hz: 20.0

imu_gyro_debias_node:
  ros__parameters:
    # Automatic gyro zero-rate bias remover, upstream of the EKF. LIKE
    # heading_hold_node and UNLIKE most of this file, this node DOES call
    # declare_parameter() for each of these, so the values here are LIVE
    # defaults the node reads at startup (not documentation). The node runs
    # when localization is launched with debias_imu:=true (the default);
    # localization.launch.py supplies raw_imu_topic / debiased_imu_topic
    # inline, so the keys that matter to override here are the tuning ones.
    #
    # Source (raw) and output (debiased) IMU topics. The launch file passes
    # these in from its imu_topic arg / internal plumbing, so these entries
    # mainly document the wiring: raw OAK IMU in, /imu/debiased out.
    raw_imu_topic: "/oak_chassis_front/imu/data"
    debiased_imu_topic: "/imu/debiased"
    # EMA weight for folding each stationary (disarmed) sample into the bias
    # estimate. SLOW on purpose: the bias is quasi-static, so a small alpha
    # averages out per-sample gyro noise and tracks only slow thermal drift.
    ema_alpha: 0.02
    # Angular-velocity axes to debias. Default z only: the gyro yaw rate is
    # the EKF's sole yaw input and two_d_mode discards x/y rates anyway.
    debias_axes: ["z"]
    # Ignore this many seconds of IMU samples after each arm->disarm edge
    # before trusting the gyro as "stationary". Skips the mechanical settle
    # transient (chassis rocking as the motors release) so it cannot poison
    # the bias EMA.
    settle_skip_s: 0.5

arm_controller:
  ros__parameters:
    # Reject-warning throttle interval, seconds. Same role as
    # drive_node above. Documentation only: hardcoded as
    # REJECT_LOG_THROTTLE_S in arm_controller_node.py.
    reject_log_throttle_s: 1.0
    # Gripper jaw positions (m) the services publish on /fortis/arm/command.
    # LIVE: arm_controller declares both. Defaults mirror the URDF
    # gripper_jaw_stroke (0.027 m open, 0.0 closed).
    gripper_open_pos: 0.027
    gripper_closed_pos: 0.0

teensy_bridge:
  ros__parameters:
    # Serial bridge to the arm Teensy 4.1. LIVE: every key below is
    # declared in teensy_bridge_node.py. NOTE: bringup.launch.py passes
    # its serial_port launch arg inline AFTER this file, so that arg
    # (default /dev/ttyACM0) wins over the value here.
    serial_port: "/dev/ttyACM0"
    baud: 1000000
    # ArmStatus publish rate and heartbeat rate, Hz. The firmware
    # (firmware/teensy/teensy.ino) faults if it misses heartbeats for
    # 250 ms, so 20 Hz (50 ms) leaves a 5x margin.
    status_rate_hz: 20.0
    heartbeat_rate_hz: 20.0
    # Stepper scale, steps per joint radian (microstepping x gearing).
    steps_per_rad_j1: 12732.4
    steps_per_rad_j2: 12732.4
    steps_per_rad_j3: 6875.5
    # J4 (wrist servo) pulse-width map: us at zero rad, us per rad, and
    # the clamp range.
    j4_us_center: 1400.0
    j4_us_per_rad: 382.0
    j4_us_min: 800
    j4_us_max: 2000
    # Gripper servo pulse widths and the jaw stroke they span (m);
    # stroke pairs with arm_controller's gripper_open_pos above.
    gripper_open_us: 1900
    gripper_closed_us: 1100
    gripper_stroke_m: 0.027
    # Per-joint stepper speed ceilings, steps/s.
    max_sps_j1: 8000.0
    max_sps_j2: 8000.0
    max_sps_j3: 8000.0

arm_motion:
  ros__parameters:
    # IK/MoveToPose execution. LIVE: arm_motion declares each of these.
    # Joint-space interpolation speed (rad/s) and waypoint stream rate (Hz).
    joint_speed_rad_s: 0.3
    command_rate_hz: 20.0
    # A move succeeds once /joint_states settles within this tolerance
    # (rad); it aborts after move_timeout_s.
    joint_tolerance_rad: 0.05
    move_timeout_s: 30.0
    # Emit /fortis/events/arm_at_view_pose after a successful move
    # (drives the FSM TARGETING -> ARM_AT_VIEW under the ik_ok guard).
    publish_view_event: true
