# Second-IMU overlay for the FORTIS EKF, selected by
# localization.launch.py second_imu:=true.
#
# Loaded AFTER the base file (ekf.yaml, or ekf_vio.yaml when vio:=true),
# so it only ADDS the imu1 block. Every other parameter, including odom0,
# imu0 and the noise matrices, comes from the base file unchanged.
#
# imu1 is a second camera IMU (the left OAK-D Lite by default; see the
# imu1_topic launch arg) fused for its gyro yaw RATE only, the same single
# channel imu0 contributes. Two gyros averaging the same yaw rate tighten
# the heading estimate without changing who owns it: yaw stays gyro-owned
# and the wheels still contribute translation only. The launch file
# remaps /imu1 to the debiased stream when debias_imu is on.
#
# Hardware testing used one IMU (imu0). This overlay is off by default.
ekf_filter_node:
  ros__parameters:
    imu1: /imu1
    imu1_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu1_queue_size: 10
    imu1_differential: false
    imu1_relative: false
    imu1_remove_gravitational_acceleration: false
