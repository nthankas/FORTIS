services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        # docker compose build does not auto-populate TARGETARCH; ./stack
        # exports it (dpkg --print-architecture). Selects the base in
        # Dockerfile.dev: amd64 -> osrf desktop, arm64 -> ros:humble-ros-base.
        TARGETARCH: "${TARGETARCH:-amd64}"
    image: fortis-dev:latest
    container_name: fortis-dev
    # Only built/run under the cpu profile. ./stack maps COMPOSE_PROFILE=cpu to
    # COMPOSE_PROFILES=cpu. This keeps the x86-only base (osrf/ros:humble-desktop)
    # from being built on the arm64 Jetson, which uses the gpu profile instead.
    profiles: ["cpu"]
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - ..:/workspace:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # OAK-D / USB-CAN passthrough: bind the WHOLE host /dev, not just
      # /dev/bus/usb. OAK cameras re-enumerate during FW upload (USB2 bootloader
      # -> USB3 SuperSpeed runtime), which destroys and recreates the USB device
      # node. A narrow /dev/bus/usb bind can leave the container holding a stale
      # handle across that switch, so the driver fails with "Failed to find
      # device after booting". Binding all of /dev lets the new SuperSpeed node
      # appear inside the container. On the PC/WSL, attach first with
      # `usbipd attach --wsl docker-desktop --busid <id>`; the Jetson is native
      # Linux and needs no attach step.
      - /dev:/dev
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      # All FORTIS ROS nodes are co-located in this container; host networking
      # exposes tailscale0/docker0/wifi, which breaks default DDS multicast
      # discovery between co-located nodes. Loopback-only DDS is correct here
      # (only the Foxglove WebSocket crosses machines, not DDS).
      - ROS_LOCALHOST_ONLY=1
    stdin_open: true
    tty: true
    command: /bin/bash
